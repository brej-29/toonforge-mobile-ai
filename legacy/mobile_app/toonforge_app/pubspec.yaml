name: toonforge_app
description: "Mobile AI Cartoon Generation app (offline TFLite + cloud fallback)."
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.6

  # HTTP client for cloud mode
  http: ^1.2.0

  # On-device TFLite inference
  tflite_flutter: ^0.10.0

  # Image picking from gallery
  image_picker: ^1.0.0

  # Saving files to app storage
  path_provider: ^2.1.0

  # Sharing results
  share_plus: ^10.0.0

  # Connectivity status (optional)
  connectivity_plus: ^6.0.0

  # Local preferences for settings
  shared_preferences: ^2.2.0

  # Image processing for TFLite pre/post-processing
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/